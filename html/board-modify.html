<!doctype html>
<html lang="kr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="/config.js"></script>
    <title>게시글 수정</title>
    <link
            rel="stylesheet"
            href="../css/board-write.css"
            crossorigin="anonymous"
    />
</head>
<body>
<div class="wrap">
    <h2>게시글 수정</h2>
    <div class="inputBox">
        <label>제목*</label>
        <input
                type="text"
                id="title"
                placeholder="제목을 입력해 주세요. (최대 26자)"
        />
    </div>
    <div class="inputBox">
        <label>내용*</label>
        <textarea id="content"></textarea>
        <p class="helperText" name="content"></p>
    </div>
    <div class="inputBox">
        <label class="non-border">이미지</label>
        <div class="imageControls">
            <label class="imagePicker" for="image">JPEG/PNG 이미지 추가</label>
            <span id="imageCount" class="imageCount">0 / 30</span>
        </div>
        <input
                class="imageInput"
                type="file"
                id="image"
                accept=".jpg,.jpeg,.png,image/jpeg,image/png"
                multiple
        />
        <p class="imageHelp">기존 이미지는 삭제를 취소할 수 있고, 새 이미지도 개별 제거할 수 있습니다.</p>
        <div id="imagePreviewText" class="imageGrid" aria-live="polite"></div>
    </div>
    <button id="submit">수정하기</button>
</div>
<div class="background"></div>
</body>
<script src="../js/board-write.js" type="module"></script>
</html>
