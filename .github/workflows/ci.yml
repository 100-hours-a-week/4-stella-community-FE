name : FE CI

run-name: ${{ github.actor }}

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# 코드 가져와서 세팅 및 빌드
jobs:
    build: 
        runs-on: ubuntu-latest
        steps: # 레포지토리에서 코드 가져오기
          - name: Checkout repository
            uses: actions/checkout@v6
            # Node.js 설치 
          - name: Set up Node.js
            uses: actions/setup-node@v6
            with:
              node-version: "23"
              cache: npm
            # 의존성 설치
          - name: Install dependencies
            run: npm ci
            # 빌드
          - name: Build
            run: npm install
          - run: npm run build