name: FE CI

run-name: ${{ github.actor }}

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  job1:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm install

      - run: npm run 

  job2:
    needs: job1
    runs-on: ubuntu-latest

    steps:
      - name: Make text_dir
        run: mkdir -p text_dir

      - name: Create File
        run: touch "text_dir/test-$(date '+%H%M%S')-01"

      - name: Check File
        run: ls -al text_dir/*

      - name: Upload Artifact text_dir
        uses: actions/upload-artifact@v4
        with:
          name: text_dir-artifact
          path: text_dir/**
          retention-days: 5