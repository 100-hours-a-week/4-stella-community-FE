name : FE CI

run-name: ${{ github.actor }}

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout repository
            uses: actions/checkout@v6

          - name: Set up Node.js
            uses: actions/setup-node@v6
            with:
              node-version: "22"
              cache: npm

          - name: Install dependencies
            run: npm ci

          - name: Build frontend
            run: npm run build