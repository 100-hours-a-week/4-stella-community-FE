name: FE CI

run-name: ${{ github.actor }} runs FE CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check server syntax
        run: node --check app.js

      - name: Check JavaScript syntax
        run: |
          find api utils \
            -type f \
            -name "*.js" \
            -exec node --check {} \;

      - name: Print available npm scripts
        run: npm run