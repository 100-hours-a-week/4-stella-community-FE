name: FE CD

run-name: Deploy ${{ github.event.workflow_run.head_sha }} to FE EC2

on:
  workflow_run:
    workflows:
      - FE CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

env:
  IMAGE_NAME: jihyeon02/board-frontend
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
  CONTAINER_NAME: board-frontend

  # app.js의 실제 포트와 맞춰야 함
  HOST_PORT: "3000"
  CONTAINER_PORT: "3000"

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: jihyeon02
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy frontend to EC2
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          HOST_PORT: ${{ env.HOST_PORT }}
          CONTAINER_PORT: ${{ env.CONTAINER_PORT }}

        with:
          host: ${{ secrets.FE_EC2_HOST }}
          username: ${{ secrets.FE_EC2_USERNAME }}
          key: ${{ secrets.FE_EC2_PRIVATE_KEY }}

          envs: IMAGE_NAME,IMAGE_TAG,CONTAINER_NAME,HOST_PORT,CONTAINER_PORT
          command_timeout: 10m

          script: |
            set -eu

            echo "프론트 이미지 다운로드"
            docker pull "$IMAGE_NAME:$IMAGE_TAG"

            echo "기존 프론트 컨테이너 제거"
            docker rm -f "$CONTAINER_NAME" 2>/dev/null || true

            echo "새 프론트 컨테이너 실행"
            docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              -p "$HOST_PORT:$CONTAINER_PORT" \
              "$IMAGE_NAME:$IMAGE_TAG"

            echo "컨테이너 시작 대기"
            sleep 10

            if ! docker ps \
              --filter "name=^/${CONTAINER_NAME}$" \
              --filter "status=running" \
              --format '{{.Names}}' |
              grep -Fx "$CONTAINER_NAME"; then

              echo "프론트 컨테이너 실행 실패"
              docker logs "$CONTAINER_NAME" || true
              exit 1
            fi

            echo "프론트 서버 응답 확인"
            if ! curl -fsS "http://localhost:$HOST_PORT" >/dev/null; then
              echo "HTTP 응답 확인 실패"
              docker logs "$CONTAINER_NAME" || true
              exit 1
            fi

            docker image prune -f

            echo "FE EC2 배포 완료"